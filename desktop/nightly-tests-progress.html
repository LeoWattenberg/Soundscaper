<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
	<title>Soundscaper Nightly Tests</title>
	<link rel="stylesheet" href="nightly-tests-progress.css">
	<script src="nightly-tests-progress-renderer.js" defer></script>
</head>
<body>
	<main>
		<p class="eyebrow">Soundscaper Nightly Tests</p>
		<h1>Tests are running</h1>
		<p id="status" class="status" role="status" aria-live="polite">Application launched</p>
		<progress id="progress" value="0" max="4" aria-label="Nightly test progress"></progress>
		<p id="count" class="count">0 of 4 phases complete</p>
		<p class="hint">This can take a while, especially while local models download and run. The result folder will be written beside this application.</p>
	</main>
</body>
</html>
