name: Sync Audacity translations

on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audacity-translation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the converter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Discover and verify the latest upstream artifact
        id: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/manage-audacity-translation-release.mjs discover \
            --output "$RUNNER_TEMP/audacity-source" \
            --max-age-hours 168 \
            --github-env "$GITHUB_ENV"

      - name: Convert the reviewed strings into the committed layer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audacity-qt-translations.mjs commit \
            --archive "$RUNNER_TEMP/audacity-source/$AUDACITY_TRANSLATION_ARCHIVE_NAME" \
            --artifact-id "$AUDACITY_TRANSLATION_ARTIFACT_ID" \
            --source-run-id "$AUDACITY_TRANSLATION_RUN_ID" \
            --source-head-sha "$AUDACITY_TRANSLATION_HEAD_SHA" \
            --source-workflow-url "$AUDACITY_TRANSLATION_WORKFLOW_URL" \
            --source-sha256 "$AUDACITY_TRANSLATION_ARCHIVE_SHA256" \
            --source-byte-length "$AUDACITY_TRANSLATION_ARCHIVE_BYTE_LENGTH" \
            --source-license "$RUNNER_TEMP/audacity-source/LICENSE.txt"

      - name: Hold the layer to the runtime's rules
        run: node --import tsx --import ./scripts/node-style-asset-loader.mjs --test tests/i18n-audacity-catalog.test.js

      - name: Commit the layer when it changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/common/i18n/audacity; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed Audacity layer already matches artifact $AUDACITY_TRANSLATION_ARTIFACT_ID."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/common/i18n/audacity
          git commit -F - <<EOF_MESSAGE
          chore(i18n): sync Audacity translations from artifact $AUDACITY_TRANSLATION_ARTIFACT_ID

          Converted from Audacity commit $AUDACITY_TRANSLATION_HEAD_SHA
          (workflow run $AUDACITY_TRANSLATION_WORKFLOW_URL) by
          scripts/audacity-qt-translations.mjs commit.
          EOF_MESSAGE
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow token starts no push workflow, so the
      # quality gate is asked for explicitly on what was just pushed.
      - name: Run the quality gate on the synced layer
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quality.yml --ref main
