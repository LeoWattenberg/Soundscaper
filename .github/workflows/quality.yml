name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Run the canonical quality checks that are not the Node test suite
        # The Node suite runs in the per-product `tests` shards below, and the
        # thresholds it feeds are enforced once over their union in `coverage`.
        run: npm run check:static
        env:
          # Type-aware linting of the whole tree exhausts the default old-space
          # limit and dies with "Ineffective mark-compacts near heap limit"
          # before it reports a single rule. The ubuntu-24.04 runner has 16 GiB.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Measure the built transfer documents against the build just made
        # The `tests` shards below never build, so the three assertions in this
        # file that read `dist/` skipped in every CI run - and they are the only
        # ones that can see the edge that matters: rolldown injects
        # `vite/preload-helper` into the transfer chunk for its dynamic archive
        # import, the `$initial` site-entry group owns the helper together with
        # react-dom, and no source-level model of the import closure can see
        # that. This is the one job that holds a build, so it is the job that
        # measures it. The variable makes an absent `dist/` a failure here rather
        # than a skip, so the guard cannot quietly stand itself down again.
        run: node --import tsx --import ./scripts/node-style-asset-loader.mjs --test tests/project-transfer-standalone-page-chunks.test.ts
        env:
          SOUNDSCAPER_TRANSFER_BUILD_REQUIRED: '1'

      - name: Upload the verified website build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Tests / ${{ matrix.shard }}
    needs: quality
    strategy:
      fail-fast: false
      # Soundscaper and Framescaper own their own source trees and everything they
      # share lives under src/common, so the suite splits three ways along a line
      # that already exists. A runner has four cores and the suite no longer fits
      # in them: measured per test file, the shared shard carries 56% of the work,
      # Framescaper 37% (its native and OpenFX tests are slow out of proportion to
      # their count) and Soundscaper 6%, so the longest job is roughly half the
      # half-hour the one job took.
      #
      # These wait on `quality` on purpose. The browser jobs are the pipeline's
      # long pole either way, so the shards lose nothing by starting after lint
      # and typecheck, and a red lint no longer burns three runners.
      matrix:
        shard: [common, framescaper, soundscaper]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # tests/milestone-5-handoff.test.js resolves HEAD^ against the real
          # checkout, so a shard cannot run against a depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display for the native-helper Electron proof
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh xvfb

      - name: Allow unprivileged user namespaces for the native isolation launcher
        # ubuntu-24.04 images restrict unprivileged user namespaces through
        # AppArmor, so the milestone-5 launcher's unshare(CLONE_NEWUSER) fails
        # with EPERM and every real-child enforcement test fail-closes with
        # "The enforcement handshake ended early" before it can attest.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Provision interchange conformance reference tools
        run: npm run provision:interchange-conformance

      - name: Run the ${{ matrix.shard }} Node test shard
        run: xvfb-run --auto-servernum npm run test:shard -- --shard=${{ matrix.shard }}
        env:
          # The headroom the suite has always run under. Nothing here merges
          # coverage — the shard only records raw V8 profiles — but a few tests
          # stage large buffers, and this keeps their limit what it was before the
          # split. The ubuntu-24.04 runner has 16 GiB, so it leaves plenty for
          # Electron and xvfb.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compact the shard's raw V8 coverage
        # Every test file leaves its own profile behind, each carrying a full copy
        # of the TypeScript source-map cache. Merging them and de-duplicating the
        # maps turns gigabytes into a single file the coverage job can consume.
        run: npm run coverage:compact -- coverage/shards/${{ matrix.shard }}.json

      - name: Upload the shard's coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage/shards
          merge-multiple: true

      - name: Enforce the coverage thresholds over the union of the shards
        # V8 records absolute file URLs, so this only merges because every job
        # checks the repository out at the same path on the same runner image.
        run: npm run coverage:check

  browser:
    name: Browser / ${{ matrix.project }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$HOME/.local" npm@12.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-build
          path: dist

      - name: Run browser workflows against the existing build
        run: npm run test:browser:built -- --project=${{ matrix.project }}

      - name: Run handbook browser workflows
        if: matrix.project == 'chromium'
        run: npm run test:docs:browser

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Browser / firefox
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Install PulseAudio
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh pulseaudio pulseaudio-utils

      - name: Configure the Firefox PulseAudio null sink and source
        run: bash scripts/ci-firefox-pulseaudio.sh

      - name: Require a live Firefox AudioContext clock
        run: node scripts/ci-firefox-audio-clock.mjs

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-build
          path: dist

      - name: Run Firefox workflows against the existing build
        run: npm run test:browser:built -- --project=firefox

      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-firefox
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    # Every gate, not just the fast ones: the Node shards feed `coverage`, and
    # the three browser jobs are the only proof the built site actually runs.
    # Cloudflare's own git integration builds on push with no knowledge of any
    # of this, so it must be turned off in both projects or it will race us.
    needs: [coverage, browser, firefox]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Never cancel a deploy midway, and never run two at once: a cancelled
    # `wrangler deploy` can leave a project on a half-uploaded asset set.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      # Both products build into ./dist, so each is built and shipped in turn
      # rather than in parallel. `build:pages` is the gated build: it runs the
      # same checks as `build` and then audits the live origin it is about to
      # replace. Everything that can fail for a reason unrelated to a live
      # origin has already run in the jobs this one needs, so the only way the
      # second product's build fails here is that its own origin is wrong.
      - name: Build Soundscaper
        run: npm run build:pages
        env:
          SCAPE_PRODUCT: soundscaper

      - name: Deploy Soundscaper
        run: npx wrangler pages deploy dist --project-name=soundscaper --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # framescaper.org is attached to the framescaper Pages project as its
      # custom domain and already carries a deployment, so this build audits it
      # directly: no SCAPE_DEPLOY_AUDIT_ORIGIN pointing the gate at the
      # project's *.pages.dev hostname, which would leave the hostname people
      # actually load unchecked, and no SCAPE_PAGES_COLD_START either. The
      # cold-start declaration excuses an origin that answers nothing at all,
      # and on a live origin it would turn an outage into a green deploy — the
      # preflight carries its own guard that fails the build if it is declared
      # while the origin answers.
      - name: Build Framescaper
        run: npm run build:pages
        env:
          SCAPE_PRODUCT: framescaper

      - name: Deploy Framescaper
        run: npx wrangler pages deploy dist --project-name=framescaper --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
