name: Desktop preview and nightly

on:
  schedule:
    # Run from the default branch every night at 02:17 UTC. The offset avoids
    # the heavy load GitHub Actions commonly sees at the top of the hour.
    - cron: '17 2 * * *'
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      artifact_variant:
        description: Desktop artifact flavor to build
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - nightly-with-tests

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-preview-and-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_FFMPEG_CORE_BASE_URL: https://assets.soundscaper.org/runtime/ffmpeg/0.12.10
  PUBLIC_TRANSLATIONS_BASE_URL: https://translations.soundscaper.org/runtime/translations/audacity/4

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require the tag to match package.json
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.RELEASE_TAG !== 'v' + pkg.version || !pkg.version.includes('-beta.'))
          throw new Error('Desktop preview tags must exactly match a beta package version.');"

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Run canonical quality checks
        run: npm run check

      - name: Install browser-engine matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser workflows
        run: npm run test:browser:built

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package ${{ matrix.product }} / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_variant == 'nightly'
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: [soundscaper, framescaper]
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
    runs-on: ${{ matrix.target.runner }}
    env:
      SCAPE_PRODUCT: ${{ matrix.product }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Stage the offline renderer and runtimes
        run: node scripts/desktop-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Package ${{ matrix.product }} ${{ matrix.target.platform }} ${{ matrix.target.arch }}
        run: npx electron-builder --config electron-builder.config.cjs --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install virtual display for Linux smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Configure Chromium sandbox for Linux smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          case "$TARGET_ARCH" in
            x64) sandbox_path="release/desktop/linux-unpacked/chrome-sandbox" ;;
            arm64) sandbox_path="release/desktop/linux-arm64-unpacked/chrome-sandbox" ;;
            *) echo "Unsupported Linux smoke architecture: $TARGET_ARCH" >&2; exit 1 ;;
          esac

          if [[ ! -f "$sandbox_path" || -L "$sandbox_path" ]]; then
            echo "Expected a regular, non-symlink Chromium sandbox at $sandbox_path" >&2
            exit 1
          fi

          sandbox_path="$(realpath --canonicalize-existing "$sandbox_path")"
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"

          if [[ "$(stat --format='%U:%G %a' "$sandbox_path")" != 'root:root 4755' ]]; then
            echo "Chromium sandbox permissions were not applied to $sandbox_path" >&2
            exit 1
          fi

      - name: Smoke the hardened packaged application
        run: node scripts/desktop-smoke.mjs
        env:
          SOUNDSCAPER_SMOKE_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SMOKE_XVFB: ${{ runner.os == 'Linux' && 'true' || 'false' }}

      - name: Smoke packaged direct WAV, AIFF, BWF, and BW64 exports
        if: matrix.product == 'soundscaper' && matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        run: npm run desktop:smoke:direct-wav
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: 'true'

      - name: Smoke packaged Soundscaper project open and reopen
        if: matrix.product == 'soundscaper' && matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        run: npm run desktop:smoke:scape-open
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: 'true'

      - name: Retain the verified runtime manifest
        shell: bash
        run: |
          cp .desktop-build/stage-manifest.json "release/desktop/runtime-manifest-${{ matrix.product }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}.json"
          cp desktop/ffmpeg-corresponding-source.json release/desktop/ffmpeg-corresponding-source.json

      - name: Upload ${{ matrix.product }} packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.product }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.dmg
            release/desktop/*.exe
            release/desktop/*.zip
            release/desktop/*.json
          if-no-files-found: error
          retention-days: 14

  package-with-tests:
    name: Package nightly-with-tests / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_variant == 'nightly-with-tests'
    needs: quality
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Build the browser application
        run: npm run build

      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      - name: Install the hermetic browser-engine matrix
        run: npx playwright install --only-shell chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Stage the nightly-with-tests application
        run: node scripts/desktop-nightly-tests-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Package nightly-with-tests ${{ matrix.target.platform }} ${{ matrix.target.arch }}
        run: >-
          npx electron-builder --config electron-builder.nightly-tests.config.cjs
          --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload nightly-with-tests package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-with-tests-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            release/desktop-nightly-tests/*.AppImage
            release/desktop-nightly-tests/*.exe
            release/desktop-nightly-tests/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  project-library-handoff:
    name: Packaged project-library handoff / linux / x64
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_variant == 'nightly'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: x64
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Stage Soundscaper
        run: node scripts/desktop-prepare.mjs
        env:
          SCAPE_PRODUCT: soundscaper
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: linux
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: x64

      - name: Package unpacked Soundscaper
        run: >-
          npx electron-builder --config electron-builder.config.cjs
          --config.directories.output=release/desktop-handoff/soundscaper
          --linux --x64 --dir
        env:
          SCAPE_PRODUCT: soundscaper
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Stage Framescaper
        run: node scripts/desktop-prepare.mjs
        env:
          SCAPE_PRODUCT: framescaper
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: linux
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: x64

      - name: Package unpacked Framescaper
        run: >-
          npx electron-builder --config electron-builder.config.cjs
          --config.directories.output=release/desktop-handoff/framescaper
          --linux --x64 --dir
        env:
          SCAPE_PRODUCT: framescaper
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Configure both Chromium sandboxes
        shell: bash
        run: |
          for sandbox_path in \
            release/desktop-handoff/soundscaper/linux-unpacked/chrome-sandbox \
            release/desktop-handoff/framescaper/linux-unpacked/chrome-sandbox
          do
            if [[ ! -f "$sandbox_path" || -L "$sandbox_path" ]]; then
              echo "Expected a regular, non-symlink Chromium sandbox at $sandbox_path" >&2
              exit 1
            fi
            sandbox_path="$(realpath --canonicalize-existing "$sandbox_path")"
            sudo chown root:root -- "$sandbox_path"
            sudo chmod 4755 -- "$sandbox_path"
            if [[ "$(stat --format='%U:%G %a' "$sandbox_path")" != 'root:root 4755' ]]; then
              echo "Chromium sandbox permissions were not applied to $sandbox_path" >&2
              exit 1
            fi
          done

      - name: Run packaged cross-product project-library handoff
        run: npm run desktop:smoke:project-library-handoff
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: 'true'

      - name: Run packaged source-bearing cross-product roundtrips
        run: npm run desktop:smoke:project-library-source-bearing-handoff
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: 'true'

  project-library-lease-matrix:
    name: Packaged lease matrix / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_variant == 'nightly'
    needs: quality
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Build both unpacked products
        shell: bash
        run: |
          for product in soundscaper framescaper; do
            SCAPE_PRODUCT="$product" \
            SOUNDSCAPER_DESKTOP_TARGET_PLATFORM="${{ matrix.target.platform }}" \
            SOUNDSCAPER_DESKTOP_TARGET_ARCH="${{ matrix.target.arch }}" \
              node scripts/desktop-prepare.mjs
            SCAPE_PRODUCT="$product" CSC_IDENTITY_AUTO_DISCOVERY=false \
              npx electron-builder --config electron-builder.config.cjs \
              --config.directories.output="release/desktop-lease-matrix/$product" \
              --${{ matrix.target.platform }} --${{ matrix.target.arch }} --dir
          done

      - name: Install virtual display
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Configure both Chromium sandboxes
        if: matrix.target.platform == 'linux'
        shell: bash
        run: |
          mapfile -t sandboxes < <(find release/desktop-lease-matrix -type f -name chrome-sandbox -print)
          if [[ "${#sandboxes[@]}" -ne 2 ]]; then
            echo "Expected two packaged Chromium sandboxes" >&2
            exit 1
          fi
          for sandbox_path in "${sandboxes[@]}"; do
            sudo chown root:root -- "$sandbox_path"
            sudo chmod 4755 -- "$sandbox_path"
          done

      - name: Run all eight packaged lease workflows in both product orderings
        shell: bash
        run: npm run desktop:smoke:project-library-lease-matrix
        env:
          SOUNDSCAPER_SMOKE_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SMOKE_XVFB: ${{ matrix.target.platform == 'linux' && 'true' || 'false' }}
          SOUNDSCAPER_LEASE_MATRIX_RESULT: ${{ runner.temp }}/lease-matrix-${{ matrix.target.platform }}-${{ matrix.target.arch }}.json

      - name: Upload bounded lease-matrix result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lease-matrix-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/lease-matrix-${{ matrix.target.platform }}-${{ matrix.target.arch }}.json
          if-no-files-found: error
          retention-days: 14
