name: Desktop preview and nightly

on:
  schedule:
    # Run from the default branch every night at 02:17 UTC. The offset avoids
    # the heavy load GitHub Actions commonly sees at the top of the hour.
    - cron: '17 2 * * *'
  push:
    branches: [main]
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      artifact_variant:
        description: Desktop artifact flavor to build
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - nightly-with-tests

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-preview-and-nightly-${{ github.ref }}
  # Branch pushes supersede each other: only the newest main commit is worth
  # packaging, and the matrix is too long to let a queue build up. Tag, schedule
  # and dispatch runs still always finish.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

env:
  PUBLIC_FFMPEG_CORE_BASE_URL: https://assets.soundscaper.org/runtime/ffmpeg/0.12.10
  PUBLIC_TRANSLATIONS_BASE_URL: https://translations.soundscaper.org/runtime/translations/audacity/4

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require the tag to match package.json
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.RELEASE_TAG !== 'v' + pkg.version || !pkg.version.includes('-beta.'))
          throw new Error('Desktop preview tags must exactly match a beta package version.');"

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Run canonical quality checks
        run: npm run check

      - name: Upload the verified website build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser / ${{ matrix.project }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$HOME/.local" npm@12.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-build
          path: dist

      - name: Run browser workflows against the existing build
        run: npm run test:browser:built -- --project=${{ matrix.project }}

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Browser / firefox
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Install PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install --yes pulseaudio pulseaudio-utils

      - name: Configure the Firefox PulseAudio null sink and source
        run: bash scripts/ci-firefox-pulseaudio.sh

      - name: Require a live Firefox AudioContext clock
        run: node scripts/ci-firefox-audio-clock.mjs

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-build
          path: dist

      - name: Run Firefox workflows against the existing build
        run: npm run test:browser:built -- --project=firefox

      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-firefox
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package ${{ matrix.product }} / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag')
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.artifact_variant == 'nightly')
    needs: [quality, browser, firefox]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: [soundscaper, framescaper]
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
    runs-on: ${{ matrix.target.runner }}
    env:
      SCAPE_PRODUCT: ${{ matrix.product }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Stage the offline renderer and runtimes
        run: node scripts/desktop-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Package ${{ matrix.product }} ${{ matrix.target.platform }} ${{ matrix.target.arch }}
        run: npx electron-builder --config electron-builder.config.cjs --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install virtual display for Linux smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Configure Chromium sandbox for Linux smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          case "$TARGET_ARCH" in
            x64) sandbox_path="release/desktop/linux-unpacked/chrome-sandbox" ;;
            arm64) sandbox_path="release/desktop/linux-arm64-unpacked/chrome-sandbox" ;;
            *) echo "Unsupported Linux smoke architecture: $TARGET_ARCH" >&2; exit 1 ;;
          esac

          if [[ ! -f "$sandbox_path" || -L "$sandbox_path" ]]; then
            echo "Expected a regular, non-symlink Chromium sandbox at $sandbox_path" >&2
            exit 1
          fi

          sandbox_path="$(realpath --canonicalize-existing "$sandbox_path")"
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"

          if [[ "$(stat --format='%U:%G %a' "$sandbox_path")" != 'root:root 4755' ]]; then
            echo "Chromium sandbox permissions were not applied to $sandbox_path" >&2
            exit 1
          fi

      - name: Smoke the hardened packaged application
        run: node scripts/desktop-smoke.mjs
        env:
          SOUNDSCAPER_SMOKE_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SMOKE_XVFB: ${{ runner.os == 'Linux' && 'true' || 'false' }}

      - name: Probe packaged CFR and VFR timing persistence
        if: matrix.target.arch == 'x64' && (matrix.target.platform == 'linux' || matrix.target.platform == 'win')
        run: npm run desktop:smoke:timing-probe
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: ${{ runner.os == 'Linux' && 'true' || 'false' }}

      - name: Smoke packaged direct WAV, AIFF, BWF, and BW64 exports
        if: matrix.product == 'soundscaper' && matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        run: npm run desktop:smoke:direct-wav
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: 'true'

      - name: Smoke packaged Soundscaper project open and reopen
        if: matrix.product == 'soundscaper' && matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        run: npm run desktop:smoke:scape-open
        env:
          SOUNDSCAPER_SMOKE_ARCH: x64
          SOUNDSCAPER_SMOKE_XVFB: 'true'

      - name: Retain the verified runtime manifest
        shell: bash
        run: |
          cp .desktop-build/stage-manifest.json "release/desktop/runtime-manifest-${{ matrix.product }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}.json"
          cp desktop/ffmpeg-corresponding-source.json release/desktop/ffmpeg-corresponding-source.json

      - name: Upload ${{ matrix.product }} packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.product }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.dmg
            release/desktop/*.exe
            release/desktop/*.zip
            release/desktop/*.json
          if-no-files-found: error
          retention-days: 14

  package-with-tests:
    name: Package nightly-with-tests / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: >-
      (github.event_name == 'push' && github.ref_type == 'branch')
      || (github.event_name == 'workflow_dispatch' && inputs.artifact_variant == 'nightly-with-tests')
    needs: [quality, browser, firefox]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build the browser application
        run: npm run build

      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      - name: Install the hermetic browser-engine matrix
        run: npx playwright install --only-shell chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Stage the nightly-with-tests application
        run: node scripts/desktop-nightly-tests-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}

      # macOS ships a 256-descriptor soft limit, and signing this bundle walks the
      # whole embedded Playwright browser matrix, so the build dies with EMFILE
      # part-way through. Raise the soft limit to whatever the kernel already allows.
      - name: Package nightly-with-tests mac ${{ matrix.target.arch }}
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hard="$(ulimit -Hn)"
          if [ "$hard" = "unlimited" ]; then ulimit -n 65536; else ulimit -n "$hard"; fi
          echo "File-descriptor limit for packaging: $(ulimit -n)"
          npx electron-builder --config electron-builder.nightly-tests.config.cjs \
            --mac --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package nightly-with-tests ${{ matrix.target.platform }} ${{ matrix.target.arch }}
        if: runner.os != 'macOS'
        run: >-
          npx electron-builder --config electron-builder.nightly-tests.config.cjs
          --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload nightly-with-tests package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-with-tests-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            release/desktop-nightly-tests/*.AppImage
            release/desktop-nightly-tests/*.exe
            release/desktop-nightly-tests/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  soundscaper-project-library-lease-matrix:
    name: Soundscaper V9 packaged lease matrix / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag')
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.artifact_variant == 'nightly')
    needs: [quality, browser, firefox]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build the unpacked Soundscaper V9 product
        shell: bash
        run: |
          SCAPE_PRODUCT=soundscaper \
            SOUNDSCAPER_DESKTOP_TARGET_PLATFORM="${{ matrix.target.platform }}" \
            SOUNDSCAPER_DESKTOP_TARGET_ARCH="${{ matrix.target.arch }}" \
            node scripts/desktop-prepare.mjs
          SCAPE_PRODUCT=soundscaper CSC_IDENTITY_AUTO_DISCOVERY=false \
            npx electron-builder --config electron-builder.config.cjs \
            --config.directories.output="release/desktop-lease-matrix/soundscaper" \
            --${{ matrix.target.platform }} --${{ matrix.target.arch }} --dir

      - name: Install virtual display
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Configure the Chromium sandbox
        if: matrix.target.platform == 'linux'
        shell: bash
        run: |
          mapfile -t sandboxes < <(find release/desktop-lease-matrix -type f -name chrome-sandbox -print)
          if [[ "${#sandboxes[@]}" -ne 1 ]]; then
            echo "Expected one packaged Chromium sandbox" >&2
            exit 1
          fi
          for sandbox_path in "${sandboxes[@]}"; do
            sudo chown root:root -- "$sandbox_path"
            sudo chmod 4755 -- "$sandbox_path"
          done

      - name: Run the seven current Soundscaper V9 lease workflows
        shell: bash
        run: npm run desktop:smoke:project-library-lease-matrix
        env:
          SOUNDSCAPER_SMOKE_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SMOKE_XVFB: ${{ matrix.target.platform == 'linux' && 'true' || 'false' }}
          SOUNDSCAPER_LEASE_MATRIX_RESULT: ${{ runner.temp }}/soundscaper-v9-lease-matrix-${{ matrix.target.platform }}-${{ matrix.target.arch }}.json

      - name: Upload bounded lease-matrix result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-v9-lease-matrix-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/soundscaper-v9-lease-matrix-${{ matrix.target.platform }}-${{ matrix.target.arch }}.json
          if-no-files-found: error
          retention-days: 14
