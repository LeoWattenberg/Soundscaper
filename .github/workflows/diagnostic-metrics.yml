name: Diagnostic metrics

# These opt-in Playwright workloads measure deterministic render correctness and
# useful performance trends. Correctness regressions fail the job; timings and
# heap values are observations tied to this runner, not release certification.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: diagnostic-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-metrics:
    name: Hosted CI diagnostics
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$HOME/.local" npm@12.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build Soundscaper
        run: npm run build

      - name: Build and verify Framescaper
        run: npm run build:browser:framescaper

      - name: Collect hosted diagnostics
        run: npm run quality:collect:ci-diagnostics

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-ci-diagnostics
          path: |
            test-results/ci-diagnostics/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
