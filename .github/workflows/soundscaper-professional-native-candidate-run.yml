name: Run Soundscaper professional native candidates

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Authenticate and assemble the five candidates after every target passes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: soundscaper-professional-native-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-cache:
    name: Authenticate Soundscaper native sources
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Provision exact Soundscaper source inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npm run provision:milestone-5-native-sources -- \
            --root="$RUNNER_TEMP/soundscaper-professional-native-source-cache" \
            --source electron-node-api-headers \
            --source juce \
            --source clap \
            --source vst3-sdk \
            --source asio-sdk \
            --source lv2
      - name: Re-authenticate the completed source cache
        shell: bash
        run: |
          set -euo pipefail
          npm run provision:milestone-5-native-sources -- --check \
            --root="$RUNNER_TEMP/soundscaper-professional-native-source-cache" \
            --source electron-node-api-headers \
            --source juce \
            --source clap \
            --source vst3-sdk \
            --source asio-sdk \
            --source lv2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-professional-native-source-cache
          path: ${{ runner.temp }}/soundscaper-professional-native-source-cache
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  candidates:
    name: Build five target-native candidates
    needs: source-cache
    uses: ./.github/workflows/soundscaper-professional-native-candidates.yml
    with:
      source-cache-artifact: soundscaper-professional-native-source-cache
      promote: ${{ inputs.promote }}
    secrets: inherit
