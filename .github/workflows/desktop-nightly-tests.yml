name: Desktop test artifacts (internal)

on:
  workflow_dispatch:
    inputs:
      nightly_tests_targets:
        description: Automated test artifact targets
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - win-x64

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-automated-test-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Run the canonical quality checks that are not the Node test suite
        # The Node suite runs in the per-product `tests` shards below, and the
        # thresholds it feeds are enforced once over their union in `coverage`.
        run: npm run check:static
        env:
          # Type-aware linting of the whole tree exhausts the default old-space
          # limit and dies with "Ineffective mark-compacts near heap limit"
          # before it reports a single rule. The ubuntu-24.04 runner has 16 GiB.
          NODE_OPTIONS: --max-old-space-size=8192
          # Hidden maps beside `dist/`, as in quality.yml, so the Chromium browser
          # shards below can record coverage of the built site for `coverage`.
          SCAPE_BUILD_SOURCE_MAPS: '1'

      - name: Measure the built transfer documents against the build just made
        # The same step quality.yml runs in its `build` job, for the same
        # reason. This job does what that whole gate does, in one runner rather
        # than sharded across several. It publishes `verified-site-build`, so a
        # build it uploads without this
        # step is a build nothing measured, sitting under the artifact name that
        # says otherwise. The `tests` shards below never build, and the
        # three assertions in this file that read `dist/` are the only ones that
        # can see the chunk-graph edge no source-level model declares: rolldown
        # injects `vite/preload-helper` into the transfer chunk for its dynamic
        # archive import, and the `$initial` site-entry group owns that helper
        # together with react-dom. The variable makes an absent `dist/` a failure
        # here rather than a skip, so the guard cannot quietly stand itself down.
        run: node --import tsx --import ./scripts/node-style-asset-loader.mjs --test tests/project-transfer-standalone-page-chunks.test.ts
        env:
          SOUNDSCAPER_TRANSFER_BUILD_REQUIRED: '1'

      - name: Build and verify the Framescaper browser site
        run: npm run build:browser:framescaper

      - name: Upload the verified website build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the verified Framescaper website build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-framescaper-site-build
          path: .wrangler/browser-products/framescaper/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the website build's source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-source-maps
          path: dist-source-maps/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Framescaper website build's source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-framescaper-site-source-maps
          path: .wrangler/browser-products/framescaper-source-maps/
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Tests / ${{ matrix.shard }}
    needs: quality
    strategy:
      fail-fast: false
      # Product ownership separates Framescaper and Soundscaper tests; the
      # shared tests run in two stable filename-hash partitions. The coverage
      # job checks the union after all four shards upload their profiles.
      #
      # These wait on `quality` on purpose. The browser jobs are the pipeline's
      # long pole either way, so the shards lose nothing by starting after lint
      # and typecheck, and a red lint does not burn the test runners.
      matrix:
        shard: [common-1, common-2, framescaper, soundscaper]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # tests/milestone-5-package-audit.test.js reads revision-bound Git inputs from the real
          # checkout, so a shard cannot run against a depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display for the native-helper Electron proof
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh xvfb

      - name: Allow unprivileged user namespaces for the native isolation launcher
        # ubuntu-24.04 images restrict unprivileged user namespaces through
        # AppArmor, so the milestone-5 launcher's unshare(CLONE_NEWUSER) fails
        # with EPERM and every real-child enforcement test fail-closes with
        # "The enforcement handshake ended early" before it can complete.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Provision interchange conformance reference tools
        run: npm run provision:interchange-conformance

      - name: Provision pinned Boost closure for Framescaper native tests
        if: matrix.shard == 'framescaper'
        run: node scripts/ci-provision-framescaper-boost.mjs

      - name: Run the ${{ matrix.shard }} Node test shard
        run: xvfb-run --auto-servernum npm run test:shard -- --shard=${{ matrix.shard }} --require-linux-native
        env:
          # The headroom the suite has always run under. Nothing here merges
          # coverage — the shard only records raw V8 profiles — but a few tests
          # stage large buffers, and this keeps their limit what it was before the
          # split. The ubuntu-24.04 runner has 16 GiB, so it leaves plenty for
          # Electron and xvfb.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compact the shard's raw V8 coverage
        # Every test file leaves its own profile behind, each carrying a full copy
        # of the TypeScript source-map cache. Merging them and de-duplicating the
        # maps turns gigabytes into a single file the coverage job can consume.
        run: npm run coverage:compact -- coverage/shards/${{ matrix.shard }}.json

      - name: Upload the shard's coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    # The Chromium browser shards upload coverage of their own, and the floors
    # are scored over the union of what the site ran and what the Node shards ran.
    needs: [tests, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage/shards
          merge-multiple: true

      - name: Enforce the coverage thresholds over the union of the shards
        # V8 records absolute file URLs, so this only merges because every job
        # checks the repository out at the same path on the same runner image.
        run: npm run coverage:check

  browser:
    name: Browser / ${{ matrix.project }} ${{ matrix.shard }}/3
    needs: quality
    strategy:
      fail-fast: false
      # Playwright ran one runner per engine with two workers on four cores, and
      # the engines are the pipeline's long pole by a wide margin: WebKit alone
      # took 29 minutes while the slowest Node shard took 17. Splitting each
      # engine three ways puts the pole back on the `common` Node shard, which
      # is where it belongs — a fourth shard would buy nothing because that
      # shard would still be waiting on `common`.
      matrix:
        project: [chromium, webkit]
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$HOME/.local" npm@12.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-build
          path: dist

      - name: Download the verified Framescaper website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-build
          path: .wrangler/browser-products/framescaper

      # Beside each site rather than inside it, as in quality.yml: every browser
      # verifies the source-map evidence before serving the digest-verified site.
      - name: Download the website build's source maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-source-maps
          path: .wrangler/browser-products/soundscaper-source-maps

      - name: Download the Framescaper website build's source maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-source-maps
          path: .wrangler/browser-products/framescaper-source-maps

      - name: Run browser workflows against the existing build
        run: npm run test:browser:built -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
        env:
          # Chromium is the only engine whose V8 coverage Playwright can read, so
          # it is the only one that records; the floors in config/coverage-gates.json
          # are set from the union that includes these runs.
          SCAPE_BROWSER_COVERAGE: ${{ matrix.project == 'chromium' && '1' || '' }}

      - name: Run the reciprocal-origin editable-copy workflow
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: npm run test:browser:dual-origin

      - name: Run handbook browser workflows
        # The handbook suite is its own config and half a minute long, so it
        # rides one shard rather than earning a job or running three times.
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: npm run test:docs:browser

      - name: Compact the shard's browser coverage
        if: matrix.project == 'chromium'
        run: npm run coverage:compact:browser -- coverage/shards/browser-chromium-${{ matrix.shard }}.json

      - name: Upload the shard's browser coverage
        if: matrix.project == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-browser-chromium-${{ matrix.shard }}
          path: coverage/shards/browser-chromium-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Browser / firefox ${{ matrix.shard }}/3
    needs: quality
    strategy:
      fail-fast: false
      # Sharded the same three ways as the containerized engines above; see the
      # `browser` job for why three.
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Install PulseAudio
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh pulseaudio pulseaudio-utils

      - name: Configure the Firefox PulseAudio null sink and source
        run: bash scripts/ci-firefox-pulseaudio.sh

      - name: Require a live Firefox AudioContext clock
        run: node scripts/ci-firefox-audio-clock.mjs

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-build
          path: dist

      - name: Download the verified Framescaper website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-build
          path: .wrangler/browser-products/framescaper

      - name: Download the website build's source maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-source-maps
          path: .wrangler/browser-products/soundscaper-source-maps

      - name: Download the Framescaper website build's source maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-source-maps
          path: .wrangler/browser-products/framescaper-source-maps

      - name: Run Firefox workflows against the existing build
        run: npm run test:browser:built -- --project=firefox --shard=${{ matrix.shard }}/3

      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-firefox-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  nightly-test-targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve nightly-with-tests target matrix
        id: resolve
        env:
          NIGHTLY_TEST_TARGETS: ${{ inputs.nightly_tests_targets || 'all' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { selectDesktopNightlyTestTargets } from './scripts/lib/desktop-nightly-tests-target-matrix.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT,
            `targets=${JSON.stringify(selectDesktopNightlyTestTargets(process.env.NIGHTLY_TEST_TARGETS))}\n`);
          NODE

  verify-assistance-runtime-handoff:
    name: Verify published AI runtimes / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: >-
      !cancelled()
      && needs.nightly-test-targets.result == 'success'
      && needs.quality.result == 'success'
      && needs.tests.result == 'success'
      && needs.coverage.result == 'success'
      && needs.browser.result == 'success'
      && needs.firefox.result == 'success'
    needs: [nightly-test-targets, quality, tests, coverage, browser, firefox]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.nightly-test-targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install local-model CPU build tools
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh build-essential cmake

      - name: Build the authenticated target-native OS audio codec host
        if: matrix.target.platform != 'linux'
        run: >-
          node scripts/ci-build-os-audio-codec-host.mjs
          --desktop-platform=${{ matrix.target.platform }}
          --desktop-arch=${{ matrix.target.arch }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}

      - name: Set up the locked Kokoro G2P builder
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: 0.12.5

      - name: Build the target-native AI runtime archives
        run: node scripts/desktop-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}

      - name: Verify the published immutable archives
        run: node scripts/publish-assistance-runtime-assets.mjs --verify

      - name: Export the source-bound AI runtime handoff
        run: node scripts/export-assistance-runtime-handoff.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
          SOUNDSCAPER_ASSISTANCE_RUNTIME_HANDOFF_ROOT: ${{ github.workspace }}/.native-build/assistance-runtime-handoff

      # Transfer only manifests and receipts. The package job reads the five
      # immutable archives from their authenticated public URLs once per target.
      - name: Upload the verified AI runtime authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assistance-runtime-handoff-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: .native-build/assistance-runtime-handoff/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  package-with-tests:
    name: Package nightly-with-tests / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    # A manual selection must pass this workflow's quality, Node, coverage, and browser gates.
    if: >-
      !cancelled()
      && needs.nightly-test-targets.result == 'success'
      && needs.verify-assistance-runtime-handoff.result == 'success'
      && needs.quality.result == 'success'
      && needs.tests.result == 'success'
      && needs.coverage.result == 'success'
      && needs.browser.result == 'success'
      && needs.firefox.result == 'success'
    needs: [nightly-test-targets, quality, tests, coverage, browser, firefox, verify-assistance-runtime-handoff]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.nightly-test-targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Download the published target-native AI runtime handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assistance-runtime-handoff-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: .native-build/assistance-runtime-handoff

      - name: Install local-model CPU build tools
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh build-essential cmake

      - name: Build the authenticated target-native OS audio codec host
        if: matrix.target.platform != 'linux'
        run: >-
          node scripts/ci-build-os-audio-codec-host.mjs
          --desktop-platform=${{ matrix.target.platform }}
          --desktop-arch=${{ matrix.target.arch }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}

      - name: Build the browser application
        run: npm run build

      - name: Build the Framescaper browser application
        run: npm run build:browser:framescaper

      - name: Prepare the verified browser product sites
        run: npm run prepare:browser:products

      - name: Build the verified reciprocal browser product sites
        run: npm run pretest:browser:dual-origin

      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      - name: Install virtual display for packaged audio-device browser gate
        if: matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh xvfb

      - name: Install the hermetic browser-engine matrix
        run: npx playwright install --no-shell chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Set up the locked Kokoro G2P builder
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: 0.12.5

      - name: Package the product runtimes exercised by nightly-with-tests
        run: node scripts/desktop-nightly-tests-products.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
          SOUNDSCAPER_VERIFY_ASSISTANCE_RUNTIMES: 'true'
          SOUNDSCAPER_ASSISTANCE_RUNTIME_HANDOFF_ROOT: ${{ github.workspace }}/.native-build/assistance-runtime-handoff

      - name: Preserve the nested Chromium sandboxes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t sandboxes < <(find release/desktop-nightly-products -type f -name chrome-sandbox -print)
          if [[ "${#sandboxes[@]}" -ne 2 ]]; then
            echo "Expected two packaged Chromium sandboxes; found ${#sandboxes[@]}" >&2
            exit 1
          fi
          sudo chown root:root -- "${sandboxes[@]}"
          sudo chmod 4755 -- "${sandboxes[@]}"

      - name: Run packaged Soundscaper audio-device browser gate
        if: matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          soundscaper_server=''
          framescaper_server=''
          cleanup() {
            for server in "$soundscaper_server" "$framescaper_server"; do
              if [[ -n "$server" ]]; then kill "$server" 2>/dev/null || true; fi
            done
            wait "$soundscaper_server" "$framescaper_server" 2>/dev/null || true
          }
          trap cleanup EXIT
          node node_modules/vite/bin/vite.js preview \
            --outDir .wrangler/browser-products/soundscaper \
            --host 127.0.0.1 --port 4322 --strictPort --logLevel error \
            >"$RUNNER_TEMP/packaged-audio-soundscaper-preview.log" 2>&1 &
          soundscaper_server=$!
          node node_modules/vite/bin/vite.js preview \
            --outDir .wrangler/browser-products/framescaper \
            --host 127.0.0.1 --port 4323 --strictPort --logLevel error \
            >"$RUNNER_TEMP/packaged-audio-framescaper-preview.log" 2>&1 &
          framescaper_server=$!
          for origin in http://127.0.0.1:4322 http://127.0.0.1:4323; do
            for attempt in {1..120}; do
              if curl --fail --silent "$origin/en/" >/dev/null; then break; fi
              if [[ "$attempt" -eq 120 ]]; then
                cat "$RUNNER_TEMP"/packaged-audio-*-preview.log >&2
                exit 1
              fi
              sleep 1
            done
          done
          xvfb-run --auto-servernum npx playwright test \
            tests/browser/desktop-packaged-audio-io.spec.js \
            --config playwright.nightly-packaged-metrics.config.mjs \
            --project packaged-soundscaper-audio-devices
        env:
          SOUNDSCAPER_NIGHTLY_TESTS_PAYLOAD_ROOT: ${{ github.workspace }}
          SOUNDSCAPER_NIGHTLY_TESTS_RUN_ROOT: ${{ runner.temp }}/packaged-audio-device-e2e
          SOUNDSCAPER_PACKAGED_PRODUCT_ROOT: ${{ github.workspace }}/release/desktop-nightly-products
          SOUNDSCAPER_PACKAGED_RUNTIME_METRICS: '1'
          SOUNDSCAPER_PACKAGED_RUNTIME_PLATFORM: linux
          SOUNDSCAPER_PACKAGED_RUNTIME_ARCH: x64
          SCAPE_PLAYWRIGHT_PRODUCT_ORIGINS: >-
            {"soundscaper":"http://127.0.0.1:4322","framescaper":"http://127.0.0.1:4323"}

      - name: Upload packaged audio-device browser diagnostics
        if: always() && matrix.target.platform == 'linux' && matrix.target.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-audio-device-browser-diagnostics-linux-x64
          path: |
            ${{ runner.temp }}/packaged-audio-device-e2e/packaged-runtime/
            ${{ runner.temp }}/packaged-audio-*-preview.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage the nightly-with-tests application
        run: node scripts/desktop-nightly-tests-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}

      # macOS ships a 256-descriptor soft limit, and ad-hoc execution sealing walks
      # the whole embedded Playwright browser matrix. Raise the soft limit to
      # whatever the kernel already allows.
      - name: Package nightly-with-tests mac ${{ matrix.target.arch }}
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hard="$(ulimit -Hn)"
          if [ "$hard" = "unlimited" ]; then ulimit -n 65536; else ulimit -n "$hard"; fi
          echo "File-descriptor limit for packaging: $(ulimit -n)"
          bash scripts/ci-electron-builder.sh \
            --config electron-builder.nightly-tests.config.cjs \
            --mac --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package nightly-with-tests ${{ matrix.target.platform }} ${{ matrix.target.arch }}
        if: runner.os != 'macOS'
        run: >-
          bash scripts/ci-electron-builder.sh
          --config electron-builder.nightly-tests.config.cjs
          --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SOUNDSCAPER_NIGHTLY_TESTS_PACKAGE_ARCH: ${{ matrix.target.arch }}

      - name: Upload nightly-with-tests package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-with-tests-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            release/desktop-nightly-tests/*.AppImage
            release/desktop-nightly-tests/*.exe
            release/desktop-nightly-tests/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
