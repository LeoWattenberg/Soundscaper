name: Desktop test artifacts (internal)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nightly_tests_targets:
        description: Desktop test artifact targets
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - win-x64
      desktop_host:
        description: Desktop host to build
        required: true
        default: electron
        type: choice
        options:
          - electron
          - tauri

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-test-artifacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  nightly-test-targets:
    if: inputs.desktop_host != 'tauri' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve nightly-with-tests target matrix
        id: resolve
        env:
          NIGHTLY_TEST_TARGETS: ${{ inputs.nightly_tests_targets || 'all' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { selectDesktopNightlyTestTargets } from './scripts/lib/desktop-nightly-tests-target-matrix.mjs';
          import { tauriPrototypeRustTarget } from './prototypes/tauri/build-targets.mjs';
          const targets = selectDesktopNightlyTestTargets(process.env.NIGHTLY_TEST_TARGETS).map((target) => ({
            ...target, rust_target: tauriPrototypeRustTarget(target.platform, target.arch),
          }));
          appendFileSync(process.env.GITHUB_OUTPUT,
            `targets=${JSON.stringify(targets)}\n`);
          NODE

  package-with-tests:
    name: Package nightly-with-tests / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: >-
      !cancelled()
      && needs.nightly-test-targets.result == 'success'
    needs: nightly-test-targets
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.nightly-test-targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Tauri WebView build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: >-
          bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev build-essential
          libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth

      - name: Install the pinned Tauri Rust toolchain and target
        working-directory: prototypes/tauri/host
        shell: bash
        env:
          TAURI_RUST_TARGET: ${{ matrix.target.rust_target }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const channel = /^channel = "([^"]+)"$/m.exec(readFileSync('rust-toolchain.toml', 'utf8'))?.[1];
          if (!channel) throw new Error('Missing prototype Rust toolchain pin.');
          execFileSync('rustup', ['toolchain', 'install', channel, '--profile', 'minimal',
            '--component', 'clippy,rustfmt', '--target', process.env.TAURI_RUST_TARGET], { stdio: 'inherit' });
          NODE
          rustup show active-toolchain

      - name: Run target-native Tauri host tests
        run: node prototypes/tauri/run.mjs test --release --target=${{ matrix.target.rust_target }}

      - name: Build the target-native Tauri smoke executable
        run: node prototypes/tauri/run.mjs build --release --target=${{ matrix.target.rust_target }}

      - name: Stage the Tauri smoke executable, source pins, and dependency notices
        run: node prototypes/tauri/stage-artifact.mjs
        env:
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
          SOUNDSCAPER_TAURI_TARGET: ${{ matrix.target.rust_target }}

      - name: Release Tauri compiler space before product packaging
        run: >-
          node --input-type=module -e
          "import { rmSync } from 'node:fs'; rmSync('.tauri-prototype/target', { recursive: true, force: true });"

      - name: Stage the pinned AI runtime handoff
        run: node scripts/stage-desktop-test-runtime-snapshot.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Build the authenticated target-native OS audio codec host
        if: matrix.target.platform != 'linux'
        run: >-
          node scripts/ci-build-os-audio-codec-host.mjs
          --desktop-platform=${{ matrix.target.platform }}
          --desktop-arch=${{ matrix.target.arch }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}

      - name: Build the browser application
        run: npm run build

      - name: Build the Framescaper browser application
        run: npm run build:browser:framescaper

      - name: Prepare the verified browser product sites
        run: npm run prepare:browser:products

      - name: Build the verified reciprocal browser product sites
        run: npm run pretest:browser:dual-origin

      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      - name: Install the hermetic browser-engine matrix
        run: npx playwright install --no-shell chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - name: Package the product runtimes exercised by nightly-with-tests
        run: node scripts/desktop-nightly-tests-products.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
          SOUNDSCAPER_VERIFY_ASSISTANCE_RUNTIMES: 'true'
          SOUNDSCAPER_ASSISTANCE_RUNTIME_HANDOFF_ROOT: ${{ github.workspace }}/.native-build/assistance-runtime-handoff

      - name: Preserve the nested Chromium sandboxes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t sandboxes < <(find release/desktop-nightly-products -type f -name chrome-sandbox -print)
          if [[ "${#sandboxes[@]}" -ne 2 ]]; then
            echo "Expected two packaged Chromium sandboxes; found ${#sandboxes[@]}" >&2
            exit 1
          fi
          sudo chown root:root -- "${sandboxes[@]}"
          sudo chmod 4755 -- "${sandboxes[@]}"

      - name: Stage the nightly-with-tests application
        run: node scripts/desktop-nightly-tests-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
          SOUNDSCAPER_NIGHTLY_TESTS_TAURI_ARTIFACT_PATH: ${{ github.workspace }}/.tauri-prototype/artifact

      - name: Verify the embedded Tauri WebView smoke on the native target
        id: tauri-native-smoke
        run: >-
          node scripts/lib/desktop-nightly-tests-tauri.mjs
          --payload "${{ github.workspace }}/.desktop-build/nightly-tests"
          --output "${{ github.workspace }}/.native-build/tauri-nightly-smoke"
          --source-revision ${{ github.sha }}
          --arch ${{ matrix.target.arch }}

      - name: Upload the native Tauri smoke diagnostics
        if: >-
          !cancelled()
          && (steps.tauri-native-smoke.outcome == 'success' || steps.tauri-native-smoke.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-smoke-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: .native-build/tauri-nightly-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # macOS ships a 256-descriptor soft limit, and ad-hoc execution sealing walks
      # the whole embedded Playwright browser matrix. Raise the soft limit to
      # whatever the kernel already allows.
      - name: Package nightly-with-tests mac ${{ matrix.target.arch }}
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hard="$(ulimit -Hn)"
          if [ "$hard" = "unlimited" ]; then ulimit -n 65536; else ulimit -n "$hard"; fi
          echo "File-descriptor limit for packaging: $(ulimit -n)"
          bash scripts/ci-electron-builder.sh \
            --config electron-builder.nightly-tests.config.cjs \
            --mac --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package nightly-with-tests ${{ matrix.target.platform }} ${{ matrix.target.arch }}
        if: runner.os != 'macOS'
        run: >-
          bash scripts/ci-electron-builder.sh
          --config electron-builder.nightly-tests.config.cjs
          --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SOUNDSCAPER_NIGHTLY_TESTS_PACKAGE_ARCH: ${{ matrix.target.arch }}

      - name: Upload nightly-with-tests package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-with-tests-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            release/desktop-nightly-tests/*.AppImage
            release/desktop-nightly-tests/*.exe
            release/desktop-nightly-tests/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  tauri-prototype-targets:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_host == 'tauri'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve Tauri prototype target matrix
        id: resolve
        env:
          NIGHTLY_TEST_TARGETS: ${{ inputs.nightly_tests_targets || 'all' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { selectTauriPrototypeBuildTargets } from './prototypes/tauri/build-targets.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT,
            `targets=${JSON.stringify(selectTauriPrototypeBuildTargets(process.env.NIGHTLY_TEST_TARGETS))}\n`);
          NODE

  package-tauri-prototype:
    name: Tauri prototype / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    if: >-
      !cancelled()
      && needs.tauri-prototype-targets.result == 'success'
    needs: tauri-prototype-targets
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.tauri-prototype-targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: >-
          bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev build-essential
          libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth

      - name: Install the pinned Rust toolchain
        working-directory: prototypes/tauri/host
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const channel = /^channel = "([^"]+)"$/m.exec(readFileSync('rust-toolchain.toml', 'utf8'))?.[1];
          if (!channel) throw new Error('Missing prototype Rust toolchain pin.');
          execFileSync('rustup', ['toolchain', 'install', channel, '--profile', 'minimal',
            '--component', 'clippy,rustfmt'], { stdio: 'inherit' });
          NODE
          rustup show active-toolchain

      - name: Run prototype host tests
        run: node prototypes/tauri/run.mjs test --release

      - name: Build the release executable
        run: node prototypes/tauri/run.mjs build --release

      - name: Smoke the Linux WebView and native file bridge
        if: runner.os == 'Linux'
        run: node prototypes/tauri/run.mjs smoke --release

      - name: Stage the executable, source pins, and dependency notices
        run: node prototypes/tauri/stage-artifact.mjs
        env:
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}

      # Archive before upload so Unix executable permissions survive download.
      - name: Archive the Tauri prototype
        shell: bash
        env:
          TAURI_PLATFORM: ${{ matrix.target.platform }}
          TAURI_ARCH: ${{ matrix.target.arch }}
        run: |
          tar -czf ".tauri-prototype/tauri-prototype-$TAURI_PLATFORM-$TAURI_ARCH.tar.gz" -C .tauri-prototype/artifact .

      - name: Upload the Tauri prototype
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-prototype-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: .tauri-prototype/tauri-prototype-*.tar.gz
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
