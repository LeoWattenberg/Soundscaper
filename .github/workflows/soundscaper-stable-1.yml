name: Soundscaper Stable 1

on:
  push:
    tags:
      - 'v1.0.0'

permissions: {}
concurrency: { group: soundscaper-stable-1, cancel-in-progress: false }

jobs:
  source:
    name: Check the tagged source
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - name: Verify the declared Soundscaper stable tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e
          "import { verifyCheckedInSoundscaperRelease }
          from './scripts/prepare-soundscaper-release.mjs';
          const release = await verifyCheckedInSoundscaperRelease({
          repositoryRoot: process.cwd(), tag: process.env.RELEASE_TAG });
          if (release.version !== '1.0.0') throw new Error('The tag does not match Soundscaper Stable 1');"
      - run: npm ci
      - name: Provision interchange conformance readers
        run: npm run provision:interchange-conformance
      - name: Run the canonical non-browser gate
        run: npm run check:static
        env: { NODE_OPTIONS: --max-old-space-size=8192 }
      - name: Build and preflight the Soundscaper Pages site
        run: npm run build:pages
        env: { SCAPE_PRODUCT: soundscaper }
      - name: Build and verify the Framescaper browser-test site
        run: npm run build:browser:framescaper
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-1-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-1-framescaper-browser-site
          path: .wrangler/browser-products/framescaper/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Node tests / ${{ matrix.shard }}
    needs: source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: common
          - shard: framescaper
          - shard: soundscaper
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - run: bash scripts/ci-apt-install.sh xvfb
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run provision:interchange-conformance
      - if: matrix.shard == 'framescaper'
        run: node scripts/ci-provision-framescaper-boost.mjs
      - name: Run the ${{ matrix.shard }} shard
        run: xvfb-run --auto-servernum npm run test:shard -- --shard=${{ matrix.shard }} --require-linux-native
        env: { NODE_OPTIONS: --max-old-space-size=8192 }
      - run: npm run coverage:compact -- coverage/shards/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-coverage-${{ matrix.shard }}
          path: coverage/shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Union coverage
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soundscaper-stable-coverage-*
          path: coverage/shards
          merge-multiple: true
      - run: npm run coverage:check

  browser:
    name: Browser workflows
    needs: source
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: soundscaper-stable-1-site, path: dist }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soundscaper-stable-1-framescaper-browser-site
          path: .wrangler/browser-products/framescaper
      - run: npm run test:browser

  professional-source:
    name: Verify professional-native sources
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Provision and verify pinned native sources
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npm run provision:milestone-5-native-sources -- \
            --root "$RUNNER_TEMP/soundscaper-professional-native-source-cache" \
            --source electron-node-api-headers --source juce --source clap \
            --source vst3-sdk --source asio-sdk --source lv2
          npm run provision:milestone-5-native-sources -- --check \
            --root "$RUNNER_TEMP/soundscaper-professional-native-source-cache" \
            --source electron-node-api-headers --source juce --source clap \
            --source vst3-sdk --source asio-sdk --source lv2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-native-source-cache
          path: ${{ runner.temp }}/soundscaper-professional-native-source-cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  native-build:
    name: Build and self-test professional-native targets
    needs: professional-source
    permissions:
      contents: read
    uses: ./.github/workflows/soundscaper-professional-native-build.yml
    with:
      source-cache-artifact: soundscaper-stable-native-source-cache

  package:
    name: Package / ${{ matrix.target.target }}
    needs: [native-build, professional-source]
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - target: win-x64
            runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - target: win-arm64
            runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: x64
          - target: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            node_arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
    runs-on: ${{ matrix.target.runner }}
    env:
      SCAPE_PRODUCT: soundscaper
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soundscaper-stable-native-source-cache
          path: ${{ runner.temp }}/soundscaper-professional-native-source-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soundscaper-professional-native-build-result-${{ matrix.target.target }}
          path: ${{ runner.temp }}/soundscaper-professional-native-build-result
      - name: Stage and revalidate the matching native build result
        shell: bash
        run: >-
          node scripts/stage-soundscaper-professional-native-build-result.mjs
          --result="$RUNNER_TEMP/soundscaper-professional-native-build-result"
          --root="$GITHUB_WORKSPACE"
      - name: Build the target-native OS codec host
        if: matrix.target.platform != 'linux'
        run: >-
          node scripts/ci-build-os-audio-codec-host.mjs
          --desktop-platform=${{ matrix.target.platform }}
          --desktop-arch=${{ matrix.target.arch }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}
      - name: Stage the verified application
        run: node scripts/desktop-prepare.mjs
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.target.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
          SOUNDSCAPER_REQUIRE_OS_AUDIO_CODEC_NATIVE: 'true'
          SOUNDSCAPER_M5_NATIVE_SOURCE_ROOT: ${{ runner.temp }}/soundscaper-professional-native-source-cache
      - name: Build unsigned packages
        run: >-
          npx electron-builder --config electron-builder.config.cjs
          --${{ matrix.target.platform }} --${{ matrix.target.arch }} --publish never
      - name: Install virtual display for Linux package smoke
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh xvfb
      - name: Configure Chromium sandbox for Linux package smoke
        if: runner.os == 'Linux'
        shell: bash
        env: { TARGET_ARCH: "${{ matrix.target.arch }}" }
        run: |
          set -euo pipefail
          if [[ "$TARGET_ARCH" == x64 ]]; then sandbox_path="release/desktop/linux-unpacked/chrome-sandbox";
          else sandbox_path="release/desktop/linux-arm64-unpacked/chrome-sandbox"; fi
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"
      - name: Smoke the package
        run: npm run desktop:smoke
        env:
          SOUNDSCAPER_SMOKE_ARCH: ${{ matrix.target.arch }}
          SOUNDSCAPER_SMOKE_XVFB: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      - name: Retain the runtime manifest
        shell: bash
        run: >-
          cp .desktop-build/stage-manifest.json
          "release/desktop/runtime-manifest-soundscaper-${{ matrix.target.target }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-package-${{ matrix.target.target }}
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.dmg
            release/desktop/*.exe
            release/desktop/*.zip
            release/desktop/runtime-manifest-soundscaper-${{ matrix.target.target }}.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble the release
    needs: [source, coverage, browser, package]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soundscaper-stable-native-source-cache
          path: ${{ runner.temp }}/soundscaper-professional-native-source-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soundscaper-stable-package-*
          path: release/desktop
          merge-multiple: true
      - name: Require nine packages and five runtime manifests, then gather notices and source
        run: npm run desktop:release-assets -- --product soundscaper
        env:
          SOUNDSCAPER_M5_NATIVE_SOURCE_ROOT: ${{ runner.temp }}/soundscaper-professional-native-source-cache
      - name: Verify assembled notices and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f release/desktop/THIRD_PARTY_LICENSES.md
          test -f release/desktop/Soundscaper-AGPL-3.0.txt
          test -f release/desktop/SHA256SUMS
      - name: Add corresponding source
        run: >-
          git archive --format=tar.gz --prefix=Soundscaper-1.0.0-source/
          --output=release/desktop/Soundscaper-1.0.0-source.tar.gz "${{ github.sha }}"
      - name: Recompute and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          checksum_file="$RUNNER_TEMP/SHA256SUMS"
          find release/desktop -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | LC_ALL=C sort -z | xargs -0 -I{} sha256sum "release/desktop/{}" \
            | sed 's#  release/desktop/#  #' > "$checksum_file"
          mv "$checksum_file" release/desktop/SHA256SUMS
          (cd release/desktop && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-1-release
          path: release/desktop/
          if-no-files-found: error
          retention-days: 90

  draft-release:
    name: Create release draft
    needs: assemble
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: soundscaper-stable-1-release, path: release/desktop }
      - name: Create the draft
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: >-
          gh release create "$GITHUB_REF_NAME" release/desktop/*
          --draft --verify-tag --title "Soundscaper 1.0.0" --generate-notes

  deploy-web:
    name: Deploy the web release
    needs: [source, draft-release]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Download the built Soundscaper site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: soundscaper-stable-1-site, path: dist }
      - name: Deploy Soundscaper Stable 1 to Pages
        run: npx wrangler pages deploy dist --project-name=soundscaper --branch=main | tee pages-deployment.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCAPE_PRODUCT: soundscaper
      - name: Verify the live Soundscaper deployment
        run: npm run verify:pages
        env:
          SCAPE_PRODUCT: soundscaper
          SCAPE_DEPLOY_EXPECTED_OFFLINE_SHELL: dist/offline-shell.json
          SCAPE_DEPLOY_IDENTITY_EVIDENCE: pages-deployment-identity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-stable-1-pages-deployment
          path: |
            pages-deployment.log
            pages-deployment-identity.json
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish Soundscaper 1.0.0
    needs: deploy-web
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: soundscaper-stable-1-pages-deployment }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release upload "$GITHUB_REF_NAME" pages-deployment.log pages-deployment-identity.json
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
