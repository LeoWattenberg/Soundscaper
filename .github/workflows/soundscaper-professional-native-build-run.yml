name: Debug Soundscaper professional native build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundscaper-professional-native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-cache:
    name: Verify native sources
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Provision and verify pinned native sources
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npm run provision:milestone-5-native-sources -- \
            --root "$RUNNER_TEMP/soundscaper-professional-native-source-cache" \
            --source electron-node-api-headers --source juce --source clap \
            --source vst3-sdk --source asio-sdk --source lv2
          npm run provision:milestone-5-native-sources -- --check \
            --root "$RUNNER_TEMP/soundscaper-professional-native-source-cache" \
            --source electron-node-api-headers --source juce --source clap \
            --source vst3-sdk --source asio-sdk --source lv2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-professional-native-source-cache
          path: ${{ runner.temp }}/soundscaper-professional-native-source-cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  build:
    name: Build all native targets
    needs: source-cache
    uses: ./.github/workflows/soundscaper-professional-native-build.yml
    with:
      source-cache-artifact: soundscaper-professional-native-source-cache
