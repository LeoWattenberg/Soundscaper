name: Soundscaper professional native candidates

on:
  workflow_call:
    inputs:
      source-cache-artifact:
        description: Authenticated M5 archive/source cache artifact from this workflow run
        required: true
        type: string
      promote:
        description: Assemble a no-overwrite five-target promotion artifact
        required: false
        default: false
        type: boolean
    secrets:
      SOUNDSCAPER_MAC_SIGNING_CERTIFICATE:
        description: Base64 PKCS#12 containing the Developer ID Application certificate
        required: false
      SOUNDSCAPER_MAC_SIGNING_PASSWORD:
        description: Password for the Developer ID Application PKCS#12
        required: false
      SOUNDSCAPER_MAC_SIGNING_IDENTITY:
        description: Exact Developer ID Application identity imported from the PKCS#12
        required: false
permissions:
  contents: read

jobs:
  candidate:
    name: Candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            node_arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_arch: arm64
          - target: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
          - target: win-x64
            runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
          - target: win-arm64
            runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install JUCE Linux development dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: >-
          bash scripts/ci-apt-install.sh
          libasound2-dev
          libfontconfig-dev
          libfreetype-dev
          libx11-dev
          libxcomposite-dev
          libxcursor-dev
          libxext-dev
          libxinerama-dev
          libxi-dev
          libxrandr-dev
          libxrender-dev
      - name: Allow unprivileged user namespaces for the native isolation launcher
        if: runner.os == 'Linux'
        # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor,
        # so the fail-closed isolation launcher cannot attest without this.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 26.5.0
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - run: npm install --global npm@12.0.1
      - name: Install candidate dependencies
        if: matrix.target != 'win-arm64'
        run: npm ci
      - name: Install Windows ARM64 candidate dependencies
        if: matrix.target == 'win-arm64'
        shell: bash
        # workerd 1.20260722.1 has no Windows ARM64 binary. This candidate does
        # not run workerd; rebuild the other approved installers and apply the
        # repository postinstall patches explicitly.
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm rebuild electron-winstaller esbuild
          npm run postinstall
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source-cache-artifact }}
          path: ${{ runner.temp }}/soundscaper-native-sources
      - name: Build target packaged Electron utility-process harness
        shell: bash
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SOUNDSCAPER_SOURCE_REVISION="$(git rev-parse HEAD)" npm run desktop:prepare
          npx electron-builder --config electron-builder.config.cjs \
            --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
          mkdir -p "$RUNNER_TEMP/soundscaper-packaged-app"
          cp -a release/desktop/. "$RUNNER_TEMP/soundscaper-packaged-app/"
      - name: Build, install, close, self-test, and seal candidate
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          npm run milestone5a:native-candidate --
          --target=${{ matrix.target }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}
          --sources="$RUNNER_TEMP/soundscaper-native-sources"
          --work-root="$RUNNER_TEMP/soundscaper-professional-work"
          --candidate="$RUNNER_TEMP/soundscaper-professional-candidate"
          --packaged-app="$RUNNER_TEMP/soundscaper-packaged-app"
      - name: Require configured Developer ID candidate credentials
        if: runner.os == 'macOS' && inputs.promote
        shell: bash
        env:
          SOUNDSCAPER_MAC_SIGNING_CERTIFICATE: ${{ secrets.SOUNDSCAPER_MAC_SIGNING_CERTIFICATE }}
          SOUNDSCAPER_MAC_SIGNING_PASSWORD: ${{ secrets.SOUNDSCAPER_MAC_SIGNING_PASSWORD }}
          SOUNDSCAPER_MAC_SIGNING_IDENTITY: ${{ secrets.SOUNDSCAPER_MAC_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$SOUNDSCAPER_MAC_SIGNING_CERTIFICATE"
          test -n "$SOUNDSCAPER_MAC_SIGNING_PASSWORD"
          case "$SOUNDSCAPER_MAC_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "A configured Developer ID Application identity is required." >&2; exit 1 ;;
          esac
      - name: Import the Developer ID candidate certificate
        if: runner.os == 'macOS' && inputs.promote
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.SOUNDSCAPER_MAC_SIGNING_CERTIFICATE }}
          p12-password: ${{ secrets.SOUNDSCAPER_MAC_SIGNING_PASSWORD }}
      - name: Build, sign, install, close, self-test, and seal macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        env:
          SOUNDSCAPER_MAC_SIGNING_IDENTITY: ${{ secrets.SOUNDSCAPER_MAC_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          signing_identity="-"
          if [[ "${{ inputs.promote }}" == "true" ]]; then
            test -n "$SOUNDSCAPER_MAC_SIGNING_IDENTITY"
            signing_identity="$SOUNDSCAPER_MAC_SIGNING_IDENTITY"
          fi
          npm run milestone5a:native-candidate -- \
            --target=${{ matrix.target }} \
            --runner-os=${{ runner.os }} \
            --runner-arch=${{ runner.arch }} \
            --sources="$RUNNER_TEMP/soundscaper-native-sources" \
            --work-root="$RUNNER_TEMP/soundscaper-professional-work" \
            --candidate="$RUNNER_TEMP/soundscaper-professional-candidate" \
            --packaged-app="$RUNNER_TEMP/soundscaper-packaged-app" \
            --macos-sdk="$(xcrun --sdk macosx --show-sdk-path)" \
            --signing-identity="$signing_identity"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-professional-native-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/soundscaper-professional-candidate
          if-no-files-found: error
          retention-days: 14

  promotion:
    name: Authenticate and assemble five-target promotion
    if: inputs.promote
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: soundscaper-professional-native-candidate-*
          path: ${{ runner.temp }}/soundscaper-native-candidates
      - name: Promote exact candidates without replacement
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 mac-arm64 win-x64 win-arm64; do
            npm run milestone5a:promote-native-candidate -- \
              --candidate="$RUNNER_TEMP/soundscaper-native-candidates/soundscaper-professional-native-candidate-$target"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-professional-native-five-target-promotion
          path: |
            config/soundscaper-professional-native-payload-manifest.json
            native/soundscaper-professional-host/prebuilt
          if-no-files-found: error
          retention-days: 14
