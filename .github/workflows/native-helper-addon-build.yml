name: Native helper addon build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-helper-addon-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-cache:
    name: Verify Electron headers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Provision exact Electron Node-API headers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/provision-milestone-5-native-sources.mjs \
            --root "$RUNNER_TEMP/native-helper-sources" \
            --source electron-node-api-headers
          node scripts/provision-milestone-5-native-sources.mjs --check \
            --root "$RUNNER_TEMP/native-helper-sources" \
            --source electron-node-api-headers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-helper-addon-source-cache
          path: ${{ runner.temp }}/native-helper-sources
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    needs: source-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            runner_os: Linux
            runner_arch: X64
            node_arch: x64
            tooling_node_arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            runner_os: Linux
            runner_arch: ARM64
            node_arch: arm64
            tooling_node_arch: arm64
          - target: mac-arm64
            runner: macos-15
            runner_os: macOS
            runner_arch: ARM64
            node_arch: arm64
            tooling_node_arch: arm64
          - target: win-x64
            runner: windows-2025
            runner_os: Windows
            runner_arch: X64
            node_arch: x64
            tooling_node_arch: x64
          - target: win-arm64
            runner: windows-11-arm
            runner_os: Windows
            runner_arch: ARM64
            node_arch: arm64
            tooling_node_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh build-essential cmake
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.tooling_node_arch }}
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-helper-addon-source-cache
          path: ${{ runner.temp }}/native-helper-sources
      - name: Activate target-native Node.js
        if: matrix.tooling_node_arch != matrix.node_arch
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.node_arch }}
      - name: Verify target-native Node.js
        shell: bash
        env:
          SOUNDSCAPER_EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: node -e 'if (process.arch !== process.env.SOUNDSCAPER_EXPECTED_NODE_ARCH) process.exit(1)'
      - name: Build and self-test target result
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          node scripts/build-native-helper-addon-result.mjs
          --target=${{ matrix.target }}
          --runner-os=${{ matrix.runner_os }}
          --runner-arch=${{ matrix.runner_arch }}
          --sources="$RUNNER_TEMP/native-helper-sources"
          --work-root="$RUNNER_TEMP/native-helper-work"
          --output="$RUNNER_TEMP/native-helper-addon-build-result"
      - name: Build and self-test macOS target result
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          node scripts/build-native-helper-addon-result.mjs
          --target=${{ matrix.target }}
          --runner-os=${{ matrix.runner_os }}
          --runner-arch=${{ matrix.runner_arch }}
          --sources="$RUNNER_TEMP/native-helper-sources"
          --work-root="$RUNNER_TEMP/native-helper-work"
          --output="$RUNNER_TEMP/native-helper-addon-build-result"
          --macos-sdk="$(xcrun --sdk macosx --show-sdk-path)"
      - name: Prove the result stages as package authority
        shell: bash
        run: >-
          node scripts/stage-native-helper-addon-build-result.mjs
          --result="$RUNNER_TEMP/native-helper-addon-build-result"
          --root="$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-helper-addon-build-result-${{ matrix.target }}
          path: ${{ runner.temp }}/native-helper-addon-build-result
          if-no-files-found: error
          retention-days: 14
