name: Soundscaper professional native build

on:
  workflow_call:
    inputs:
      source-cache-artifact:
        description: Verified native source-cache artifact from this workflow run
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            tooling_node_arch: x64
            node_arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            tooling_node_arch: arm64
            node_arch: arm64
          - target: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            tooling_node_arch: arm64
            node_arch: arm64
          - target: win-x64
            runner: windows-2025
            platform: win
            arch: x64
            tooling_node_arch: x64
            node_arch: x64
          - target: win-arm64
            runner: windows-11-arm
            platform: win
            arch: arm64
            tooling_node_arch: x64
            node_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install JUCE Linux development dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: >-
          bash scripts/ci-apt-install.sh
          libasound2-dev
          libfontconfig-dev
          libfreetype-dev
          libx11-dev
          libxcomposite-dev
          libxcursor-dev
          libxext-dev
          libxinerama-dev
          libxi-dev
          libxrandr-dev
          libxrender-dev
      - name: Allow unprivileged user namespaces for the native isolation launcher
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.tooling_node_arch }}
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source-cache-artifact }}
          path: ${{ runner.temp }}/soundscaper-native-sources
      - name: Build a non-publishable Electron self-test harness
        shell: bash
        env:
          SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
          SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
          SOUNDSCAPER_NATIVE_HARNESS_PREPARATION: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          SOUNDSCAPER_SOURCE_REVISION="$(git rev-parse HEAD)" npm run desktop:prepare
          npx electron-builder --config electron-builder.config.cjs \
            --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
          mkdir -p "$RUNNER_TEMP/soundscaper-packaged-app"
          cp -a release/desktop/. "$RUNNER_TEMP/soundscaper-packaged-app/"
      - name: Activate target-native Node.js
        if: matrix.tooling_node_arch != matrix.node_arch
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.node_arch }}
          package-manager-cache: false
      - name: Pin target-native npm
        if: matrix.tooling_node_arch != matrix.node_arch
        run: npm install --global npm@12.0.1
      - name: Verify target-native Node.js
        if: matrix.tooling_node_arch != matrix.node_arch
        shell: bash
        env:
          SOUNDSCAPER_EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          set -euo pipefail
          node -e 'if (process.arch !== process.env.SOUNDSCAPER_EXPECTED_NODE_ARCH) process.exit(1)'
          test "$(npm --version)" = "12.0.1"
      - name: Select Windows profile-volume native workspace
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SOUNDSCAPER_NATIVE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Get-Item -LiteralPath $env:LOCALAPPDATA
          if (($profile.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'The Windows local application-data directory is a reparse point.'
          }
          $temporaryRoot = Join-Path $profile.FullName "soundscaper-native-$env:GITHUB_RUN_ID-$env:SOUNDSCAPER_NATIVE_TARGET"
          if (Test-Path -LiteralPath $temporaryRoot) { throw 'The native work directory already exists.' }
          $created = New-Item -ItemType Directory -Path $temporaryRoot
          "TEMP=$($created.FullName)" >> $env:GITHUB_ENV
          "TMP=$($created.FullName)" >> $env:GITHUB_ENV
          "SOUNDSCAPER_NATIVE_WORK_ROOT=$(Join-Path $created.FullName 'work')" >> $env:GITHUB_ENV
      - name: Build, self-test, and verify the target result
        if: runner.os != 'macOS'
        shell: bash
        run: >-
          node scripts/build-soundscaper-professional-native.mjs
          --target=${{ matrix.target }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}
          --sources="$RUNNER_TEMP/soundscaper-native-sources"
          --work-root="${SOUNDSCAPER_NATIVE_WORK_ROOT:-$RUNNER_TEMP/soundscaper-professional-work}"
          --output="$RUNNER_TEMP/soundscaper-professional-native-build-result"
          --packaged-app="$RUNNER_TEMP/soundscaper-packaged-app"
      - name: Build, ad-hoc seal, self-test, and verify the macOS result
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          node scripts/build-soundscaper-professional-native.mjs
          --target=${{ matrix.target }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}
          --sources="$RUNNER_TEMP/soundscaper-native-sources"
          --work-root="$RUNNER_TEMP/soundscaper-professional-work"
          --output="$RUNNER_TEMP/soundscaper-professional-native-build-result"
          --packaged-app="$RUNNER_TEMP/soundscaper-packaged-app"
          --macos-sdk="$(xcrun --sdk macosx --show-sdk-path)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundscaper-professional-native-build-result-${{ matrix.target }}
          path: ${{ runner.temp }}/soundscaper-professional-native-build-result
          if-no-files-found: error
          retention-days: 14
